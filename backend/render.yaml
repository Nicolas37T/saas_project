services:
  # Backend FastAPI
  - type: web
    name: saas-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Cambia esto por tu URL de Vercel después del primer despliegue

databases:
  - name: saas-db
    plan: free # El plan gratuito de Render dura 90 días
    postgresMajorVersion: 15
